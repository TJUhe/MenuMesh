name: MSVC v142

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msvc-v142-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.config }} x64
    runs-on: windows-2019
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            enable_install: OFF
            excluded_labels: performance|external
          - config: Release
            enable_install: ON
            excluded_labels: performance

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify v142 toolset
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instance = & $vswhere -latest -version '[16.0,17.0)' -products * `
            -requires Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64 `
            -property installationPath
          if (-not $instance) {
            $instance = & $vswhere -latest -version '[16.0,17.0)' -products * `
              -requires Microsoft.VisualStudio.Component.VC.v142.x86.x64 `
              -property installationPath
          }
          if (-not $instance) {
            throw "The windows-2019 runner does not contain Visual Studio 2019 with MSVC v142."
          }
          $versionFile = Join-Path $instance "VC\Auxiliary\Build\Microsoft.VCToolsVersion.v142.default.txt"
          $toolsetVersion = (Get-Content $versionFile -Raw).Trim()
          if ($toolsetVersion -notmatch '^14\.29\.') {
            throw "Expected the VS2019 16.11 toolset (14.29), found $toolsetVersion."
          }
          Write-Host "Using MSVC toolset $toolsetVersion from $instance"

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 16 2019" -A x64 -T v142
          -DBUILD_TESTING=ON
          -DMANUMESH_BUILD_TESTS=ON
          -DMANUMESH_REQUIRE_ARCHITECTURE_CHECKS=ON
          -DMANUMESH_BUILD_PERFORMANCE_TESTS=OFF
          -DMANUMESH_ENABLE_INSTALL=${{ matrix.enable_install }}
          -DMANUMESH_BUILD_DOCS=OFF
          -DMANUMESH_EIGEN_PROVIDER=vendored
          -DMANUMESH_GOOGLETEST_PROVIDER=source

      - name: Verify selected compiler
        shell: pwsh
        run: |
          $compilerFile = Get-ChildItem build\CMakeFiles -Recurse `
            -Filter CMakeCXXCompiler.cmake | Select-Object -First 1
          if (-not $compilerFile) {
            throw "CMake did not record C++ compiler metadata."
          }
          $compilerInfo = Get-Content $compilerFile.FullName -Raw
          if ($compilerInfo -notmatch 'set\(CMAKE_CXX_COMPILER_VERSION "19\.29\.') {
            throw "CMake did not select the expected MSVC 19.29 compiler."
          }
          Write-Host "CMake selected MSVC 19.29 from $($compilerFile.FullName)"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2

      - name: Test
        shell: pwsh
        run: >-
          ctest --test-dir build -C ${{ matrix.config }}
          -LE '${{ matrix.excluded_labels }}'
          --output-on-failure --no-tests=error --timeout 600
