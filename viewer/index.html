<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Line Quadrics Viewer</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene"></canvas>
      <section class="panel" aria-label="viewer controls">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <h1>Line Quadrics Viewer</h1>
            <p id="status">Loading demo metrics</p>
          </div>
        </div>

        <label>
          <span>Paper scene</span>
          <select id="caseSelect"></select>
        </label>

        <label>
          <span>Comparison target</span>
          <select id="variantSelect"></select>
        </label>

        <div class="range-row">
          <button id="prevBtn" title="Previous result" aria-label="Previous result">&lt;</button>
          <input id="variantRange" type="range" min="0" value="0" />
          <button id="nextBtn" title="Next result" aria-label="Next result">&gt;</button>
        </div>

        <div class="toggles">
          <label><input id="showOriginal" type="checkbox" checked /> Original</label>
          <label><input id="showWire" type="checkbox" /> Wire</label>
          <label><input id="autoCycle" type="checkbox" /> Cycle</label>
        </div>

        <dl class="metrics">
          <div><dt>Quality</dt><dd id="qualityMetric">-</dd></div>
          <div><dt>Edge CV</dt><dd id="edgeMetric">-</dd></div>
          <div><dt>Faces</dt><dd id="faceMetric">-</dd></div>
          <div><dt>Distance</dt><dd id="distanceMetric">-</dd></div>
        </dl>
      </section>

      <div class="legend" aria-label="legend">
        <span><i class="swatch result"></i> simplified</span>
        <span><i class="swatch original"></i> original</span>
      </div>
      <div class="side-label side-left" id="leftLabel">baseline</div>
      <div class="side-label side-right" id="rightLabel">line quadrics</div>
    </main>
    <script type="module" src="/viewer/src/main.js"></script>
  </body>
</html>
